<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris DX</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: white;
    }
    #game {
      width: 640px;
      height: 480px;
      max-width: 95vw;
      max-height: 80vh;
    }
  </style>
</head>
<body>

  <h2 style="margin-bottom: 10px;">Tetris DX (Game Boy Color)</h2>

  <div style="width: 100%; display: flex; justify-content: center;">
    <div id="game"></div>
  </div>

  <script>
    window.EJS_player = '#game';
    window.EJS_core = 'gb';
    window.EJS_gameUrl = 'tetris.gbc';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/ [cdn.emulatorjs.org]';
    window.EJS_startOnLoaded = false;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js [cdn.emulatorjs.org]"></script>

</body>
</html>
