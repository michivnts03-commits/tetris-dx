<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tetris DX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      width: 100vw;
      height: 100dvh;
      max-width: 600px;
      position: relative;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    EJS_player = '#game';
    EJS_core = 'gb';
    EJS_gameUrl = 'tetris.gbc';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/ [cdn.emulatorjs.org]';
    EJS_startOnLoaded = false;
    EJS_alignStartButton = 'center';
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js [cdn.emulatorjs.org]"></script>

</body>
</html>
